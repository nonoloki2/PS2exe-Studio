name: Windows .NET 10 build
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/PS2EXE.Studio.App/PS2EXE.Studio.App.csproj
      - name: Build
        run: dotnet build src/PS2EXE.Studio.App/PS2EXE.Studio.App.csproj --configuration Release --no-restore
      - name: Publish
        run: dotnet publish src/PS2EXE.Studio.App/PS2EXE.Studio.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: PS2EXE-Studio-win-x64
          path: publish/win-x64/
